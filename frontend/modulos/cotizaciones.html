<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizaciones - MAS QUE FIANZAS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/design-system.css?v=9.0">
  <link rel="stylesheet" href="../assets/skin-engine.css?v=11.0">
  <link rel="stylesheet" href="../assets/components.css?v=9.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPDF + AutoTable -->
  <script src="../assets/lib/jspdf.umd.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';document.head.appendChild(s);"></script>
  <script src="../assets/lib/jspdf.plugin.autotable.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js';document.head.appendChild(s);"></script>
  <!-- SheetJS para Excel/CSV -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <!-- JSZip para ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Logo MQF en Base64 (necesario para PDFs) -->
  <script src="../assets/logo_b64.js?v=4"></script>
  <!-- API Client -->
  <script src="../assets/api-client.js?v=8.0.0"></script>
  <!-- Motor de exportación con dibujarCotizacionPDF() -->
  <script src="../assets/data-export.js"></script>
  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6fb; }

    /* =====================================================
       NOFTRAB HEADER CONTRAST FIX — inline para garantía
       Sobreescribe cualquier regla de h1/h2/h3 global
       ===================================================== */
    .mqf-module-header h1,
    .mqf-module-header h2,
    .mqf-module-header h3,
    .mqf-module-header__title {
        color: #ffffff !important;
    }
    .mqf-module-header p,
    .mqf-module-header__subtitle {
        color: rgba(255, 255, 255, 0.85) !important;
    }

    .cot-panel { display: none; padding: 20px; }
    .cot-panel.active { display: block; }
    .section-card { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .section-title { font-size: 15px; font-weight: 700; color: #1e1b4b; margin: 0 0 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; }
    .fianza-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group.full { grid-column: 1 / -1; }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 11px 24px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #4338ca; }
    .result-card { background: linear-gradient(135deg, #eef2ff, #f5f3ff); border: 1.5px solid #c7d2fe; border-radius: 12px; padding: 20px; }
    .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e0e7ff; }
    .result-row .label { color: #6b7280; }
    .result-row .value { font-weight: 600; color: #1e1b4b; }
    .result-row .amount { font-size: 20px; font-weight: 700; color: #4f46e5; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f5f3ff; padding: 10px; text-align: left; color: #4338ca; font-weight: 600; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    /* Historial toolbar */
    .hist-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .btn-export-main { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:#4f46e5; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
    .btn-export-main:hover { background:#4338ca; }
    .btn-import-main { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:#0d9488; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
    .btn-import-main:hover { background:#0f766e; }
    .dropdown-export { position:relative; display:inline-block; }
    .export-menu { display:none; position:absolute; top:100%; left:0; background:#fff; border:1.5px solid #e5e7eb; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:100; min-width:180px; padding:6px 0; }
    .export-menu button { display:block; width:100%; text-align:left; padding:9px 16px; border:none; background:none; cursor:pointer; font-size:13px; color:#374151; }
    .export-menu button:hover { background:#f5f3ff; color:#4f46e5; }
    .btn-print-row { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; background:#1e40af; color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer; }
    .btn-print-row:hover { background:#1d4ed8; }
    .btn-edit-row { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; background:#f59e0b; color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer; margin-right:5px; }
    .btn-edit-row:hover { background:#d97706; }
    .btn-process-row { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; background:#10b981; color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer; margin-left:5px; }
    .btn-process-row:hover { background:#059669; }
    .btn-delete-row { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; background: #ef4444; color: #fff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; margin-left: 5px; }
    .btn-delete-row:hover { background: #dc2626; }
    .mqf-btn--danger { background: #ef4444 !important; color: #fff !important; }
    .mqf-btn--danger:hover { background: #dc2626 !important; }
    .hist-count { font-size:13px; color:#6b7280; margin-left:auto; }
  </style>
</head>
<body>
  <div class="mqf-module-header">
    <h1 class="mqf-module-header__title"><i class="fa-solid fa-chart-line"></i> Módulo de Cotizaciones</h1>
    <p class="mqf-module-header__subtitle">Genera cotizaciones de Seguros de Ley y Fianzas</p>
    <div class="mqf-module-tabs">
      <button class="mqf-module-tab active" onclick="showTab('seguros')" id="tab-seguros">🚗 Seguros de Ley</button>
      <button class="mqf-module-tab" onclick="showTab('fianzas')" id="tab-fianzas">🛡️ Fianzas</button>
      <button class="mqf-module-tab" onclick="showTab('historial')" id="tab-historial">📜 Historial</button>
    </div>
  </div>

  <!-- SEGUROS DE LEY - COTIZADOR REACT -->
  <div class="cot-panel active" id="panel-seguros">
    <div id="root-seguros"></div>
  </div>

  <!-- FIANZAS -->
  <div class="cot-panel" id="panel-fianzas">
    <div class="mqf-card">
      <div class="mqf-card-header">
        <h3 class="mqf-card-title">🛡️ Nueva Cotización de Fianza</h3>
      </div>
      <div class="mqf-form-grid-2">
        <div class="mqf-form-group"><label>Nombre del Cliente *</label><input type="text" id="f_nombre" placeholder="Nombre completo" class="mqf-input"></div>
        <div class="mqf-form-group"><label>Cédula / RNC</label><input type="text" id="f_cedula" placeholder="000-0000000-0" class="mqf-input"></div>
        <div class="mqf-form-group"><label>Teléfono</label><input type="tel" id="f_telefono" placeholder="(809) 000-0000" class="mqf-input"></div>
        <div class="mqf-form-group"><label>Correo</label><input type="email" id="f_email" placeholder="correo@email.com" class="mqf-input"></div>
        <div class="mqf-form-group">
          <label>Compañía Aseguradora *</label>
          <select id="f_aseguradora" onchange="cargarTiposFianzaSimple()" class="mqf-select">
            <option value="">Cargando...</option>
          </select>
        </div>
        <div class="mqf-form-group">
          <label>Tipo de Fianza *</label>
          <select id="f_tipo" onchange="calcularFianza()" class="mqf-select">
            <option value="">Seleccione aseguradora primero</option>
          </select>
        </div>
        <div class="mqf-form-group">
          <label>Plazo (meses)</label>
          <select id="f_plazo" onchange="calcularFianza()" class="mqf-select">
            <option value="1">1 mes</option>
            <option value="3">3 meses</option>
            <option value="6">6 meses</option>
            <option value="12" selected>12 meses</option>
            <option value="18">18 meses</option>
            <option value="24">24 meses</option>
            <option value="36">36 meses</option>
          </select>
        </div>
        <div class="mqf-form-group">
          <label>Tasa Especial Manual (%) <span style="color:#9ca3af;">(opcional)</span></label>
          <input type="number" id="f_tasa_manual" placeholder="Ej: 3.0" step="0.01" min="0" oninput="calcularFianza()" class="mqf-input">
        </div>
        <div class="mqf-form-group mqf-form-full"><label>Monto Afianzado (DOP) *</label><input type="number" id="f_monto" placeholder="0.00" oninput="calcularFianza()" class="mqf-input"></div>
        <div class="mqf-form-group mqf-form-full"><label>Beneficiario</label><input type="text" id="f_beneficiario" placeholder="Nombre de la entidad" class="mqf-input"></div>
      </div>
      <div style="margin-top:16px; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="f_usar_ncf" style="width:auto; height:16px; width:16px;" class="mr-1"> 
        <label for="f_usar_ncf" style="font-size:13px; color:#4b5563; cursor:pointer; font-weight:600;">Generar NCF (Comprobante Fiscal B02)</label>
      </div>
      <div style="margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="mqf-btn mqf-btn--primary" id="btn-guardar-fianza" onclick="guardarCotizacion()"><i class="fa-solid fa-save"></i> Guardar y Descargar PDF</button>
        <button class="mqf-btn mqf-btn--danger" id="btn-eliminar-fianza" onclick="eliminarFianzaActual()" style="display:none; background-color:#ef4444;"><i class="fa-solid fa-trash"></i> Eliminar Cotización</button>
        <button class="mqf-btn mqf-btn--secondary" id="btn-cancelar-fianza" onclick="cancelarEdicionFianza()" style="display:none;"><i class="fa-solid fa-rotate-left"></i> Cancelar Edición</button>
      </div>
    </div>
    <div class="mqf-card" style="margin-top:16px; background: linear-gradient(135deg, var(--mqf-primary-light), var(--mqf-bg)); border-color: var(--mqf-border);">
      <div class="mqf-card-header" style="border-bottom-color: var(--mqf-border);">
        <h3 class="mqf-card-title" style="color: var(--mqf-primary-dark);"><i class="fa-solid fa-calculator"></i> Resultado</h3>
      </div>
      <div id="resultado-body"><p style="color:#9ca3af;text-align:center;padding:20px;">Complete el formulario para ver el resultado</p></div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div class="cot-panel" id="panel-historial">
    <div class="mqf-card">
      <div class="mqf-card-header">
        <h3 class="mqf-card-title">📜 Historial de Cotizaciones</h3>
      </div>
      <!-- Toolbar Exportar / Importar -->
      <div class="hist-toolbar">
        <div class="dropdown-export">
          <button class="mqf-btn mqf-btn--primary" onclick="toggleExportMenuHist()">
            <i class="fa-solid fa-file-export"></i> Exportar <i class="fa-solid fa-chevron-down" style="font-size:11px;"></i>
          </button>
          <div class="export-menu" id="exportMenuHist">
            <button onclick="exportarListado('pdf','cotizaciones')"><i class="fa-solid fa-file-pdf" style="color:#e53935;width:18px;"></i> PDF (listado)</button>
            <button onclick="exportarListado('excel','cotizaciones')"><i class="fa-solid fa-file-excel" style="color:#1d6f42;width:18px;"></i> Excel (.xlsx)</button>
            <button onclick="exportarListado('csv','cotizaciones')"><i class="fa-solid fa-file-csv" style="color:#0d9488;width:18px;"></i> CSV</button>
            <button onclick="exportarListado('json','cotizaciones')"><i class="fa-solid fa-code" style="color:#7c3aed;width:18px;"></i> JSON</button>
            <button onclick="exportarListado('zip','cotizaciones')"><i class="fa-solid fa-file-zipper" style="color:#b45309;width:18px;"></i> ZIP</button>
          </div>
        </div>
        <label class="mqf-btn mqf-btn--secondary btn-importar" style="cursor:pointer;">
          <i class="fa-solid fa-file-import"></i> Importar
          <input type="file" accept=".xlsx,.csv" style="display:none;" onchange="importarCotizaciones(event)">
        </label>
        <button class="mqf-btn mqf-btn--danger" id="btn-eliminar-masivo" onclick="eliminarCotizacionesSeleccionadas()" style="display:none; background-color:#ef4444;"><i class="fa-solid fa-trash-can"></i> Eliminar Seleccionados (<span id="count-seleccionados">0</span>)</button>
        <div class="mqf-form-group" style="flex:1; min-width:250px; margin-bottom:0; position:relative;">
          <input type="text" id="hist-search" placeholder="🔍 Buscar por N°, Cliente o Tipo..." oninput="filtrarHistorial()" class="mqf-input" style="padding:10px 15px;">
        </div>
        <span class="hist-count" id="hist-count-label" style="background:var(--mqf-bg); padding:6px 12px; border-radius:20px; font-weight:600; color:var(--mqf-text-secondary); border: 1px solid var(--mqf-border);"></span>
      </div>

      <div id="historial-body" class="mqf-table-wrapper" style="min-height:200px;">
        <p style="color:#9ca3af;text-align:center;padding:30px;"><i class="fa-solid fa-spinner fa-spin"></i><br>Cargando...</p>
      </div>
    </div>
  </div>

  <script>
    // === TAB SWITCHING ===
    function showTab(name) {
      document.querySelectorAll('.cot-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.mqf-module-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'historial') cargarHistorial();
    }

    // === FORMAT CURRENCY ===
    function fmt(n) { return Number(n).toLocaleString('es-DO', { style: 'currency', currency: 'DOP' }); }

    // === FIANZAS LOGIC (NOFTRAB PREMIUM CAJA NEGRA) ===
    window._aseguradorasSimplesList = [];
    window._tiposSimplesList = [];

    async function cargarAseguradorasSimple() {
      const select = document.getElementById('f_aseguradora');
      if (!select) return;
      select.innerHTML = '<option value="">Cargando...</option>';

      try {
        const res = await api.solicitud('/fianza_tarifarios.php?action=listar_aseguradoras', 'GET');
        if (res.exito && res.datos) {
          window._aseguradorasSimplesList = res.datos;
          select.innerHTML = '<option value="">Seleccione...</option>';
          res.datos.forEach(a => {
            const option = document.createElement('option');
            option.value = a.id;
            option.textContent = a.nombre;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = '<option value="">Error al cargar aseguradoras</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">Error de conexión</option>';
      }
    }

    async function cargarTiposFianzaSimple(callback) {
      const aseguradoraId = document.getElementById('f_aseguradora').value;
      const select = document.getElementById('f_tipo');
      if (!select) return;

      if (!aseguradoraId) {
        select.innerHTML = '<option value="">Seleccione aseguradora primero</option>';
        window._tiposSimplesList = [];
        return;
      }

      select.innerHTML = '<option value="">Cargando tipos...</option>';

      try {
        const res = await api.solicitud('/fianza_tarifarios.php?action=listar_tipos&aseguradora_id=' + aseguradoraId, 'GET');
        if (res.exito && res.datos) {
          window._tiposSimplesList = res.datos;
          select.innerHTML = '<option value="">Seleccione...</option>';
          res.datos.forEach(t => {
            const option = document.createElement('option');
            option.value = t.id;
            // IMPORTANTE: NO mostrar porcentaje/tasa en el label (NOFTRAB R1 & R5)
            option.textContent = t.tipo_fianza;
            select.appendChild(option);
          });
          if (typeof callback === 'function') callback();
        } else {
          select.innerHTML = '<option value="">Error al cargar tipos</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">Error de conexión</option>';
      }
      calcularFianza();
    }

    function obtenerCoberturasPorNombre(nombreTipo, monto) {
      const nombre = (nombreTipo || '').toLowerCase();
      const amount1 = Math.round(monto * 0.10);
      const amount2 = Math.round(monto * 0.05);
      
      if (nombre.includes('judicial')) {
        return [
          { label: 'Fianza Judicial de Appearance', amount: amount1 || 50000 },
          { label: 'Fianza Judicial de Payment', amount: amount1 || 50000 },
          { label: 'Garantía de Caución', amount: amount2 || 25000 }
        ];
      } else if (nombre.includes('contractual')) {
        return [
          { label: 'Cumplimiento de Contrato', amount: amount1 || 100000 },
          { label: 'Buena Calidad', amount: amount2 || 75000 },
          { label: 'Anticipo', amount: amount2 || 50000 }
        ];
      } else if (nombre.includes('aduanal') || nombre.includes('aduana')) {
        return [
          { label: 'Garantía Aduanera', amount: amount1 || 100000 },
          { label: 'Devolución de Garantía', amount: amount2 || 75000 },
          { label: 'Garantía de Pago', amount: amount2 || 50000 }
        ];
      } else if (nombre.includes('cumplimiento')) {
        return [
          { label: 'Fiel Cumplimiento', amount: amount1 || 150000 },
          { label: 'Buena Ejecución', amount: amount2 || 100000 },
          { label: 'Garantía de Mantenimiento', amount: amount2 || 50000 }
        ];
      } else if (nombre.includes('licitación') || nombre.includes('licitacion') || nombre.includes('oferta') || nombre.includes('propuesta')) {
        return [
          { label: 'Seriedad de Oferta', amount: amount1 || 50000 },
          { label: 'Fianza de Mantenimiento de Oferta', amount: amount2 || 75000 },
          { label: 'Garantía de Suspensión', amount: amount2 || 50000 }
        ];
      } else if (nombre.includes('anticipo')) {
        return [
          { label: 'Reembolso de Anticipo', amount: amount1 || 100000 },
          { label: 'Correcta Inversión del Anticipo', amount: amount2 || 75000 },
          { label: 'Garantía de Anticipo', amount: amount2 || 50000 }
        ];
      } else {
        return [
          { label: 'Garantía de Pago', amount: amount1 || 100000 },
          { label: 'Garantía de Proveedor', amount: amount2 || 75000 },
          { label: 'Aval Financiero', amount: amount2 || 50000 }
        ];
      }
    }

    async function calcularFianza() {
      const tipoId = document.getElementById('f_tipo').value;
      const monto = parseFloat(document.getElementById('f_monto').value) || 0;
      const plazo = parseInt(document.getElementById('f_plazo').value) || 12;
      const body = document.getElementById('resultado-body');
      const f_tasa_manual = document.getElementById('f_tasa_manual');
      const tasaManualVal = f_tasa_manual ? parseFloat(f_tasa_manual.value) : 0;

      if (!tipoId || monto <= 0) {
        body.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:20px;">Seleccione tipo e ingrese monto</p>';
        return;
      }

      body.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:20px;"><i class="fa-solid fa-spinner fa-spin"></i> Calculando...</p>';

      try {
        const payload = {
          tarifario_id: parseInt(tipoId),
          monto_afianzado: monto,
          plazo_meses: plazo
        };
        if (!isNaN(tasaManualVal) && tasaManualVal > 0) {
          payload.tasa_manual = tasaManualVal;
        }

        const res = await api.solicitud('/fianzas.php?action=calcular', 'POST', payload);
        if (res.exito && res.datos) {
          const calc = res.datos;
          const numCot = window._editingFianzaNum || ('F-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 9000 + 1000));
          
          const selectedOption = document.getElementById('f_tipo').selectedOptions[0];
          const tipoNombre = selectedOption ? selectedOption.textContent : 'Fianza';

          const coberturas = obtenerCoberturasPorNombre(tipoNombre, monto);
          let coberturaHTML = '';
          if (coberturas.length > 0) {
            coberturaHTML = '<div style="margin-top:16px;padding-top:16px;border-top:1px solid #e0e7ff;"><div style="font-size:13px;font-weight:600;color:#4338ca;margin-bottom:10px;">Coberturas Incluidas:</div>';
            coberturas.forEach(c => {
              coberturaHTML += '<div class="result-row"><span class="label">' + c.label + '</span><span class="value">' + fmt(c.amount) + '</span></div>';
            });
            coberturaHTML += '</div>';
          }

          body.innerHTML = '<div class="result-row"><span class="label">N° Cotización</span><span class="value">' + numCot + '</span></div>' +
            '<div class="result-row"><span class="label">Tipo</span><span class="value">' + tipoNombre + '</span></div>' +
            '<div class="result-row"><span class="label">Monto</span><span class="value">' + fmt(monto) + '</span></div>' +
            '<div class="result-row"><span class="label">Plazo</span><span class="value">' + plazo + ' meses</span></div>' +
            '<div class="result-row"><span class="label">Prima Base</span><span class="value">' + fmt(calc.prima_base) + '</span></div>' +
            '<div class="result-row"><span class="label">ISC (16%)</span><span class="value">' + fmt(calc.itbis) + '</span></div>' +
            (calc.prima_minima_aplicada ? '<div class="result-row" style="color:#d97706;font-weight:500;"><span class="label">⚠️ Prima Mínima</span><span class="value">Aplicada</span></div>' : '') +
            coberturaHTML +
            '<div class="result-row" style="border-top:2px solid #c7d2fe;margin-top:8px;padding-top:12px;"><span class="label" style="font-weight:600;">Total</span><span class="amount">' + fmt(calc.total) + '</span></div>';

          window.currentCot = {
            numero: numCot,
            tipo: tipoNombre,
            monto: monto,
            plazo: plazo,
            prima: calc.prima_base,
            impuesto: calc.itbis,
            total: calc.total,
            coberturas: coberturas,
            tasa_manual: tasaManualVal || null
          };
        } else {
          body.innerHTML = '<p style="color:#ef4444;text-align:center;padding:20px;">❌ Error al calcular: ' + (res.mensaje || 'Respuesta inválida') + '</p>';
        }
      } catch (err) {
        body.innerHTML = '<p style="color:#ef4444;text-align:center;padding:20px;">❌ Error de conexión al calcular: ' + err.message + '</p>';
      }
    }

    async function guardarCotizacion() {
      const nombre = document.getElementById('f_nombre').value.trim();
      const cedula = document.getElementById('f_cedula').value.trim();
      const telefono = document.getElementById('f_telefono').value.trim();
      const email = document.getElementById('f_email').value.trim();
      const tipoId = document.getElementById('f_tipo').value;
      const aseguradoraId = document.getElementById('f_aseguradora').value;
      const monto = parseFloat(document.getElementById('f_monto').value) || 0;
      const beneficiario = document.getElementById('f_beneficiario').value.trim();

      if (!nombre || !tipoId || monto <= 0) {
        MQF.toast('Complete: Nombre, Tipo de fianza y Monto', 'warning');
        return;
      }

      // En modo edición: si no se recalculó, pre-poblar currentCot con datos del registro guardado
      if (!window.currentCot && window._editingFianzaId && window.cotizacionesData) {
        const existing = window.cotizacionesData.find(c => String(c.id) === String(window._editingFianzaId));
        if (existing) {
          window.currentCot = {
            numero:   existing.numero,
            tipo:     existing.subtipo || existing.tipo,
            plazo:    existing.plazo || 12,
            prima:    parseFloat(existing.prima_base || 0),
            impuesto: parseFloat(existing.impuesto   || 0),
            total:    parseFloat(existing.total       || 0),
            coberturas: existing.cobertura ? 
              (typeof existing.cobertura === 'string' ? 
                JSON.parse(existing.cobertura || '[]') : 
                existing.cobertura) : 
              (existing.servicios_opcionales ? 
                (typeof existing.servicios_opcionales === 'string' ? 
                  JSON.parse(existing.servicios_opcionales || '[]') : 
                  existing.servicios_opcionales) : []),
            tasa_manual: existing.tasa_manual || null
          };
        }
      }

      if (!window.currentCot) {
        // Intentar calcular primero
        await calcularFianza();
      }
      if (!window.currentCot) {
        MQF.toast('Recalcule la prima antes de guardar', 'warning');
        return;
      }
      const cot = window.currentCot;

      const aseguradoraOption = document.getElementById('f_aseguradora').selectedOptions[0];
      const aseguradoraNombre = aseguradoraOption ? aseguradoraOption.textContent : '';

      const data = {
        tipo: 'FIANZA',
        subtipo: cot.tipo,
        numero: window._editingFianzaNum || cot.numero,
        cliente: nombre,
        cedula: cedula,
        telefono: telefono,
        email: email,
        aseguradora: aseguradoraNombre,
        monto_afianzado: monto,
        plazo: cot.plazo,
        prima_base: cot.prima,
        impuesto: cot.impuesto,
        total: cot.total,
        cobertura: JSON.stringify(cot.coberturas),
        beneficiario: beneficiario,
        tasa_manual: cot.tasa_manual,
        fecha: new Date().toISOString(),
        usar_ncf: document.getElementById('f_usar_ncf').checked
      };

      const action = window._editingFianzaId ? 'actualizar' : 'guardar';
      if (window._editingFianzaId) data.id = window._editingFianzaId;

      const btn = document.getElementById('btn-guardar-fianza');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
      }

      try {
        const res = await api.solicitud(`/cotizaciones.php?action=${action}`, 'POST', data);

        if (res.exito) {
          MQF.toast(window._editingFianzaId ? '✅ Fianza actualizada correctamente' : '✅ Cotización guardada: ' + cot.numero, 'success');
          
          generarPDFFianzaProfesional(data);
          
          limpiarFormularioFianza();
          
          setTimeout(() => {
            cargarHistorial();
            showTab('historial');
          }, 1000);
        } else {
          MQF.toast('Error al guardar: ' + (res.mensaje || 'Respuesta inválida del servidor'), 'error');
        }
      } catch (e) {
        MQF.toast('Error de conexión con el servidor: ' + e.message, 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          if (window._editingFianzaId) {
            btn.innerHTML = '<i class="fa-solid fa-save"></i> Guardar Cambios';
          } else {
            btn.innerHTML = '<i class="fa-solid fa-save"></i> Guardar y Descargar PDF';
          }
        }
      }
    }

    function generarPDFFianzaProfesional(data) {
      try {
        const { jsPDF } = window.jspdf;
        if (!jsPDF) { MQF.toast('Motor PDF no disponible', 'error'); return; }
        const doc = new jsPDF();
        // Normalizar datos: coberturas → string para dibujarCotizacionPDF
        const dataNorm = Object.assign({}, data);
        // Normalizar campos de nombre cruzado
        dataNorm.cliente    = dataNorm.cliente    || dataNorm.cliente_nombre || dataNorm.nombre || '';
        dataNorm.telefono   = dataNorm.telefono   || dataNorm.cliente_telefono || '';
        dataNorm.email      = dataNorm.email      || dataNorm.cliente_email    || '';
        dataNorm.beneficiario = dataNorm.beneficiario || '';
        dataNorm.aseguradora  = dataNorm.aseguradora  || dataNorm.aseguradora_nombre || '';
        dataNorm.subtipo      = dataNorm.subtipo      || dataNorm.tipo_fianza || '';
        dataNorm.prima_base   = parseFloat(dataNorm.prima_base  || dataNorm.prima || 0);
        dataNorm.impuesto     = parseFloat(dataNorm.impuesto    || dataNorm.itbis || dataNorm.prima_base * 0.16);
        dataNorm.total        = parseFloat(dataNorm.total || 0);
        dataNorm.monto_afianzado = parseFloat(dataNorm.monto_afianzado || dataNorm.valor_afianzado || 0);
        // Coberturas: asegurar que sea string vacío si es array, y parsear si es JSON string
        if (typeof dataNorm.cobertura === 'string' && dataNorm.cobertura.trim().startsWith('[')) {
          try {
            dataNorm.coberturas = JSON.parse(dataNorm.cobertura);
          } catch(e) {
            dataNorm.coberturas = [];
          }
        } else if (Array.isArray(dataNorm.cobertura)) {
          dataNorm.coberturas = dataNorm.cobertura;
          dataNorm.cobertura = '';
        }
        if (Array.isArray(dataNorm.coberturas)) {
          dataNorm.coberturas = dataNorm.coberturas.map(c => typeof c === 'object' ? (c.nombre || c.tipo || c.label || '') : c);
        }
        if (typeof dibujarCotizacionPDF === 'function') {
          dibujarCotizacionPDF(doc, dataNorm, window.LOGO_MQF_B64 || window.MQF_LOGO_B64 || null, null);
          MQF.toast('✅ PDF generado correctamente', 'success');
        } else {
          MQF.toast('Motor PDF no cargado (data-export.js)', 'error');
          console.error('dibujarCotizacionPDF no disponible — verifica data-export.js');
        }
      } catch (e) {
        MQF.toast('Error al generar PDF: ' + e.message, 'error');
        console.error('PDF Error:', e);
      }
    }

    function cargarHistorial() {
      const body = document.getElementById('historial-body');
      body.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:30px;"><i class="fa-solid fa-spinner fa-spin"></i><br>Cargando...</p>';

      // Cargar desde ambas fuentes en paralelo
      Promise.all([
        api.solicitud('/cotizaciones.php?action=listar'),
        api.solicitud('/fianzas.php?action=listar&limit=200')
      ]).then(([resCot, resFz]) => {
          // Fuente 1: cotizaciones (todos los tipos)
          const cotData = (resCot.exito && Array.isArray(resCot.datos)) ? resCot.datos : [];
          cotData.forEach(c => { c._origen = 'cotizaciones'; });

          // Fuente 2: fianzas del wizard (tabla fianzas) — solo tipo FIANZA
          const fzRaw = (resFz.exito && resFz.datos)
            ? (Array.isArray(resFz.datos) ? resFz.datos : (Array.isArray(resFz.datos.fianzas) ? resFz.datos.fianzas : []))
            : [];
          const fzData = fzRaw.map(f => ({
            ...f,
            _origen:  'fianzas',
            tipo:     'FIANZA',
            numero:   f.numero || f.numero_fianza,
            cliente:  f.cliente || f.cliente_nombre,
            total:    f.total || 0,
            fecha:    f.fecha_inicio || f.creado_en || f.fecha,
            subtipo:  f.tipo_fianza || f.subtipo,
            aseguradora: f.aseguradora || f.aseguradora_nombre
          }));

          // Unificar: cotizaciones primero, luego fianzas del wizard
          // Evitar duplicados: si una cotizacion ya referencia una fianza por numero, omitir
          const numerosEnCot = new Set(cotData.filter(c => (c.tipo||'').toUpperCase()==='FIANZA').map(c => c.numero).filter(Boolean));
          const fzNuevos = fzData.filter(f => !numerosEnCot.has(f.numero));

          window.cotizacionesData = [...cotData, ...fzNuevos];

          const countLabel = document.getElementById('hist-count-label');
          if (countLabel) countLabel.textContent = window.cotizacionesData.length + ' registros encontrados';

          if (window.cotizacionesData.length > 0) {
            renderizarTablaHistorial(window.cotizacionesData);
          } else {
            body.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:30px;">No hay cotizaciones guardadas aún.</p>';
          }
        })
        .catch(e => {
          body.innerHTML = '<p style="color:red;text-align:center;padding:30px;">Error al cargar historial: ' + e.message + '</p>';
        });
    }

    function filtrarHistorial() {
      const input = document.getElementById('hist-search');
      if (!input) return;
      // Limpiar espacios, guiones especiales y caracteres invisibles
      const query = input.value.toLowerCase().trim().replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/–|—/g, "-");
      const body = document.getElementById('historial-body');
      
      if (!window.cotizacionesData || window.cotizacionesData.length === 0) return;

      if (query === "") {
        renderizarTablaHistorial(window.cotizacionesData);
        return;
      }

      const filtered = window.cotizacionesData.filter(c => {
        // Búsqueda global definitiva: convierte todo el registro a texto y busca coincidencias
        // Esto ignora nombres de campos y detecta valores en cualquier propiedad
        try {
          return JSON.stringify(c).toLowerCase().includes(query);
        } catch (e) {
          // Fallback por si hay referencias circulares (poco probable aquí)
          return Object.values(c).join(" ").toLowerCase().includes(query);
        }
      });

      if (filtered.length === 0) {
        body.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:30px;">No se encontraron coincidencias para "<strong>' + input.value + '</strong>".</p>';
        return;
      }

      renderizarTablaHistorial(filtered);
    }

    function renderizarTablaHistorial(datos) {
      const body = document.getElementById('historial-body');
      let html = '<table class="mqf-table"><thead><tr>' +
        '<th style="width:40px; text-align:center;"><input type="checkbox" id="select-all-historial" onclick="seleccionarTodasCotizaciones(this.checked)"></th>' +
        '<th>N°</th><th>Tipo</th><th>Cliente</th>' +
        '<th style="text-align:right;">Total</th>' +
        '<th>Fecha</th><th>Origen</th>' +
        '<th style="text-align:center;">Acciones</th>' +
        '</tr></thead><tbody>';

      datos.forEach((c) => {
        const qId = c.id;
        const origen = c._origen || 'cotizaciones';
        
        let chk = '';
        if (origen === 'cotizaciones') {
          chk = '<input type="checkbox" class="select-cotizacion-chk" data-id="' + qId + '" onchange="actualizarEstadoBotonEliminarMasivo()">';
        } else {
          chk = '<input type="checkbox" disabled title="Registros del Wizard no se pueden eliminar desde aquí">';
        }

        // Badge de origen visual
        const badgeOrigen = origen === 'fianzas'
          ? '<span style="font-size:10px;background:#ede9fe;color:#4338ca;padding:2px 6px;border-radius:8px;">🧙 Wizard</span>'
          : '<span style="font-size:10px;background:#f0fdf4;color:#15803d;padding:2px 6px;border-radius:8px;">⚡ Cotizador</span>';
        // Tipo badge
        const tipoBadge = '<span style="background:#eef2ff;color:#4338ca;padding:2px 8px;border-radius:4px;font-size:12px;">' + (c.tipo || '-') + '</span>';
        // Fecha unificada
        const fecha = c.fecha || c.fecha_inicio || c.creado_en || '';
        // Fix TZ-shift: date-only strings ('YYYY-MM-DD') are parsed as UTC midnight,
        // which shifts to the previous day in UTC-4 (America/Santo_Domingo).
        // Appending 'T12:00:00' treats the date as local noon, preventing day rollback.
        const fechaSafe = fecha && fecha.length === 10 ? fecha + 'T12:00:00' : fecha;
        const fechaStr = fechaSafe ? new Date(fechaSafe).toLocaleDateString('es-DO') : '-';

        // Botones: Editar solo para cotizaciones del cotizador, PDF disponible para todos
        let btns = '';
        if (origen === 'cotizaciones') {
          btns += '<button class="btn-edit-row" onclick="editarCotizacion(\'' + qId + '\')" title="Editar"><i class="fa-solid fa-pen"></i> Editar</button>';
          btns += '<button class="btn-print-row" onclick="imprimirCotizacion(\'' + qId + '\')" title="PDF"><i class="fa-solid fa-print"></i> PDF</button>';
          if (c.tipo === 'SEGURO DE LEY') {
            btns += '<button class="btn-process-row" onclick="procesarCotizacionARegistro(\'' + c.numero + '\')" title="Procesar"><i class="fa-solid fa-gear"></i> Procesar</button>';
          }
          btns += '<button class="btn-delete-row" onclick="eliminarCotizacionHistorial(\'' + qId + '\')" title="Eliminar"><i class="fa-solid fa-trash"></i> Eliminar</button>';
        } else {
          // Fianzas del wizard: link al módulo de fianzas para editar
          btns += '<button class="btn-print-row" onclick="imprimirCotizacion(\'' + qId + '\', \'fianzas\')" title="PDF"><i class="fa-solid fa-file-pdf"></i> PDF</button>';
        }

        html += '<tr>' +
          '<td style="text-align:center;">' + chk + '</td>' +
          '<td><strong>' + (c.numero || '-') + '</strong></td>' +
          '<td>' + tipoBadge + '</td>' +
          '<td>' + (c.cliente || 'N/A') + '</td>' +
          '<td style="text-align:right;font-weight:bold;color:#1e40af;">' + fmt(c.total || 0) + '</td>' +
          '<td>' + fechaStr + '</td>' +
          '<td>' + badgeOrigen + '</td>' +
          '<td style="text-align:center;">' + btns + '</td>' +
          '</tr>';
      });

      html += '</tbody></table>';
      body.innerHTML = html;
      
      // Limpiar selección superior al renderizar
      const selectAllCheckbox = document.getElementById('select-all-historial');
      if (selectAllCheckbox) selectAllCheckbox.checked = false;
      actualizarEstadoBotonEliminarMasivo();
    }

    // Imprimir una cotización individual del historial
    // origen: 'cotizaciones' (por defecto) | 'fianzas' (wizard)
    function imprimirCotizacion(id, origen) {
      if (!window.cotizacionesData) return;
      const c = window.cotizacionesData.find(item => String(item.id) === String(id));
      if (!c) {
        MQF.toast('No se encontró la cotización ID: ' + id, 'error'); return;
      }
      // Si es del wizard de fianzas, usar generarPDFFianzaProfesional
      if ((origen || c._origen) === 'fianzas') {
        generarPDFFianzaProfesional(c);
        return;
      }
      if (typeof dibujarCotizacionPDF === 'function') {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        dibujarCotizacionPDF(doc, c, window.LOGO_MQF_B64 || null, null);
      } else {
        MQF.toast('Motor PDF no disponible. Recarga la página.', 'error');
      }
    }

    // Cargar para editar
    function editarCotizacion(id) {
      console.log("Iniciando edición para ID:", id);
      if (!window.cotizacionesData) { console.error("No hay datos cargados"); return; }
      
      const c = window.cotizacionesData.find(item => String(item.id) === String(id));
      if (!c) {
        console.error("Cotización no encontrada para ID:", id, window.cotizacionesData);
        MQF.toast('No se encontró la cotización ID: ' + id, 'error'); return;
      }
      console.log("Registro encontrado:", c);

          numero: numCot,
          cliente: cliente,
          cedula: cedula,
          uso: uso,
          capacidad: capacidad,
          aseguradora: insurer,
          cobertura: selectedCoverage,
          plazo: 0,
          prima_base: price,
          servicios_opcionales: JSON.stringify(optionalSelected),
          prima_mensual: 0,
          impuesto: 0,
          total: totalPrice,
          usar_ncf: usarNCF,
          fecha: new Date().toISOString()
        };
        
        if (isEdit) data.id = editingId;
        const action = isEdit ? 'actualizar' : 'guardar';
        
        api.solicitud(`/cotizaciones.php?action=${action}`, 'POST', data).then(res=>{
          setIsSaving(false);
          if (res.exito) {
            const finalNum = res.datos?.numero || data.numero;
            MQF.toast('Cotización ' + (isEdit ? 'actualizada' : 'guardada') + ': ' + finalNum, 'success');
            setEditingId(null);
            setEditingNum(null);
            // Restablecer campos
            setType(''); setUso(''); setCapacidad(''); setInsurer(''); setPrice(0); setErrors({}); setSelectedCoverage(''); setOptionalSelected({}); setUsarNCF(false);
            setCliente(''); setCedula('');
            cargarHistorial();
          } else {
            MQF.toast('Error: ' + res.mensaje, 'error');
          }
        }).catch(e=> {
          setIsSaving(false);
          MQF.toast('Error: ' + e.message, 'error');
        });
      }

      function imprimirPDFActual() {
        if(!validate()) return;
        
        const numCot = editingNum || ('SL-TEMP-' + Math.floor(Math.random() * 9000 + 1000));
        
        const data = {
          tipo: 'SEGURO DE LEY',
          subtipo: type,
          numero: numCot,
          cliente: cliente,
          cedula: cedula,
          uso: uso,
          capacidad: capacidad,
          aseguradora: insurer,
          cobertura: selectedCoverage,
          plazo: 0,
          prima_base: price,
          servicios_opcionales: optionalSelected,
          prima_mensual: 0,
          impuesto: 0,
          total: totalPrice,
          usar_ncf: usarNCF,
          fecha: new Date().toISOString()
        };
        
        generarPDFSeguroProfesional(data);
      }

      function generarPDFSeguroProfesional(data) {
        try {
          const { jsPDF } = window.jspdf;
          if (!jsPDF) { MQF.toast('Motor PDF no disponible', 'error'); return; }
          const doc = new jsPDF();
          // Asegurar que servicios_opcionales sea objeto (no string) para dibujarCotizacionPDF
          const dataNorm = Object.assign({}, data);
          if (typeof dataNorm.servicios_opcionales === 'string') {
            try { dataNorm.servicios_opcionales = JSON.parse(dataNorm.servicios_opcionales); } catch(e) { dataNorm.servicios_opcionales = {}; }
          }
          if (typeof dibujarCotizacionPDF === 'function') {
            dibujarCotizacionPDF(doc, dataNorm, window.LOGO_MQF_B64 || null, null);
            MQF.toast('✅ PDF generado correctamente', 'success');
          } else {
            MQF.toast('Motor PDF no cargado (data-export.js)', 'error');
            console.error('dibujarCotizacionPDF no disponible — verifica data-export.js');
          }
        } catch(e){
          console.error('PDF Error:', e);
          MQF.toast('Error al generar PDF: ' + e.message, 'error');
        }
      }

      return (
        <div className="mqf-card w-full">
          <div className="mqf-card-header">
            <h3 className="mqf-card-title">🚗 Nueva Cotización de Seguro de Ley</h3>
          </div>
          
          {/* SECCIÓN CLIENTE: 2 columnas */}
          <div className="border-b border-gray-200 pb-4 mb-4">
            <h4 className="text-sm font-semibold text-gray-700 mb-3 uppercase tracking-wider">Datos del Cliente</h4>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="mqf-form-group">
                <label>Nombre del Cliente *</label>
                <input type="text" value={cliente} onChange={e=>{setCliente(e.target.value); setErrors(prev=>{ const n={...prev}; delete n.cliente; return n; });}} placeholder="Nombre completo" className="mqf-input" />
                {errors.cliente && <div className="text-sm text-red-600 mt-1">{errors.cliente}</div>}
              </div>
              <div className="mqf-form-group">
                <label>Cédula / RNC *</label>
                <input type="text" value={cedula} onChange={e=>{setCedula(e.target.value); setErrors(prev=>{ const n={...prev}; delete n.cedula; return n; });}} placeholder="000-0000000-0" className="mqf-input" />
                {errors.cedula && <div className="text-sm text-red-600 mt-1">{errors.cedula}</div>}
              </div>
            </div>
          </div>

          {/* SECCIÓN VEHÍCULO: 3 columnas */}
          <div className="border-b border-gray-200 pb-4 mb-4">
            <h4 className="text-sm font-semibold text-gray-700 mb-3 uppercase tracking-wider">Datos del Vehículo</h4>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="mqf-form-group">
                <label>Tipo de Vehículo *</label>
                <select value={type} onChange={e=>{ setType(e.target.value); setUso(''); setCapacidad(''); setInsurer(''); setPrice(0); setSelectedCoverage(''); }} className="mqf-select">
                  <option value="">Seleccione Tipo...</option>
                  {tipos.map(t=> <option key={t} value={t}>{t}</option>)}
                </select>
                {errors.type && <div className="text-sm text-red-600 mt-1">{errors.type}</div>}
              </div>
              <div className="mqf-form-group">
                <label>Uso *</label>
                <select value={uso} onChange={e=>{ setUso(e.target.value); setCapacidad(''); setInsurer(''); setPrice(0); }} disabled={!type} className="mqf-select">
                  <option value="">Seleccione Uso...</option>
                  {usos.map(u=> <option key={u} value={u}>{u}</option>)}
                </select>
                {errors.uso && <div className="text-sm text-red-600 mt-1">{errors.uso}</div>}
              </div>
              <div className="mqf-form-group">
                <label>Capacidad / Cilindrada *</label>
                <select value={capacidad} onChange={e=>setCapacidad(e.target.value)} disabled={!uso} className="mqf-select">
                  <option value="">Seleccione Capacidad...</option>
                  {capacidades.map(c=> <option key={c} value={c}>{c}</option>)}
                </select>
                {errors.capacidad && <div className="text-sm text-red-600 mt-1">{errors.capacidad}</div>}
              </div>
            </div>
          </div>

          {/* SECCIÓN RESULTADOS: 2 columnas */}
          {type && uso && capacidad && (
            <div className="bg-gray-50/50 border border-gray-100 rounded-xl p-4 mb-4">
              <h4 className="text-sm font-semibold text-gray-700 mb-3 uppercase tracking-wider"><i className="fa-solid fa-calculator"></i> Coberturas y Costos</h4>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* Columna izquierda: Coberturas y Opcionales */}
                <div className="space-y-4">
                  {selectedCoverage && (
                    <div className="p-4 border border-gray-100 rounded-lg bg-white shadow-sm">
                      <div className="flex items-center justify-between">
                        <div className="font-semibold text-gray-800">Cobertura: {selectedCoverage}</div>
                        <div className="flex items-center gap-3">
                          <div className="text-sm text-gray-500 font-medium">Incluida</div>
                          <button type="button" onClick={()=>setShowCoverageDetails(s=>!s)} className="px-2 py-1 text-sm border rounded hover:bg-gray-100 font-semibold text-gray-700">{showCoverageDetails? 'Ocultar detalles' : 'Ver detalles'}</button>
                        </div>
                      </div>
                      {showCoverageDetails && (
                        <div className="mt-3 space-y-2 border-t pt-3">
                          {(COVERAGE_PROFILES[String(selectedCoverage).trim()]||[]).map((c,idx)=> (
                            <div key={idx} className="flex justify-between text-sm text-gray-600">
                              <div>{c.label}</div>
                              <div className="font-medium text-gray-800">{currency(c.amount)}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {selectedCoverage && (
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">Servicios Opcionales</label>
                      <div className="space-y-2">
                        {OPTIONAL_SERVICES.map(s=>{
                          if(selectedCoverage && selectedCoverage.includes('LIVIANO') && s.id === 'ASIST_VIAL_PES') return null;
                          if(selectedCoverage && selectedCoverage.includes('PESADO') && s.id === 'ASIST_VIAL_LIV') return null;
                          const disabled = (s.id === 'CENTRO_AUTOMOVILISTA' && optionalSelected.CASA_CONDUCTOR) || (s.id === 'CASA_CONDUCTOR' && optionalSelected.CENTRO_AUTOMOVILISTA);
                          return (
                            <label key={s.id} className={`flex items-center justify-between p-3 border rounded-lg cursor-pointer transition-all ${optionalSelected[s.id]?'bg-indigo-50/35 border-indigo-200':'bg-white hover:bg-gray-50'}`}>
                              <div className="flex items-center">
                                <input type="checkbox" disabled={disabled} checked={!!optionalSelected[s.id]} onChange={e=> setOptionalSelected(prev=>({ ...prev, [s.id]: e.target.checked }))} className="mr-3 h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" />
                                <div className="text-sm font-medium text-gray-700">{s.label}</div>
                              </div>
                              <div className="text-sm text-gray-600">—</div>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                {/* Columna derecha: Aseguradoras y Total */}
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-4 border border-gray-100 rounded-lg bg-white shadow-sm">
                      <div className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Aseguradora</div>
                      <div className="text-lg font-bold text-gray-800 mt-1">{insurer || '—'}</div>
                    </div>
                    <div className="p-4 border border-gray-100 rounded-lg bg-green-50/50 shadow-sm">
                      <div className="text-xs font-semibold text-green-700 uppercase tracking-wider">Precio estimado</div>
                      <div className="text-xl font-extrabold text-green-600 mt-1">{currency(totalPrice || 0)}</div>
                    </div>
                  </div>

                  <div>
                    <div className="text-sm font-semibold text-gray-700 mb-2">Otras aseguradoras disponibles</div>
                    <div className="space-y-2">
                      {insurersList.length ? insurersList.map(i=> (
                        <label key={i.aseguradora} className={`flex items-center justify-between p-3 border rounded-lg cursor-pointer transition-all ${insurer===i.aseguradora?'border-indigo-500 bg-indigo-50/30 ring-2 ring-indigo-500/20':'bg-white hover:bg-gray-50'}`}>
                          <div className="flex items-center">
                            <input type="radio" name="insurer" value={i.aseguradora} checked={insurer===i.aseguradora} onChange={()=>{ setInsurer(i.aseguradora); setPrice(i.prima); setErrors(prev=>{ const n={...prev}; delete n.insurer; delete n.price; return n; }); }} className="mr-3 h-4 w-4 text-indigo-600 border-gray-300 focus:ring-indigo-500" />
                            <div className="text-sm font-medium text-gray-700">{i.aseguradora}</div>
                          </div>
                          <div className="font-semibold text-gray-800">{currency(i.prima)}</div>
                        </label>
                      )) : (
                        <div className="text-sm text-gray-500">No hay tarifas disponibles para la selección.</div>
                      )}
                    </div>
                    {errors.insurer && <div className="mt-2 text-sm text-red-600">{errors.insurer}</div>}
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ACCIONES DEL FORMULARIO */}
          <div className="mt-6 flex items-center gap-4 flex-wrap border-t border-gray-200 pt-4">
            <button type="button" onClick={guardarCotizacionSeguro} disabled={isSaving} className="mqf-btn mqf-btn--success" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
              {isSaving ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-save"></i>}
              {isSaving ? 'Guardando...' : (editingId ? 'Guardar Cambios' : 'Guardar')}
            </button>
            
            <button type="button" onClick={imprimirPDFActual} className="mqf-btn mqf-btn--primary" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
              <i className="fa-solid fa-print"></i> Imprimir PDF
            </button>

            {editingId && (
              <button type="button" onClick={() => {
                if (confirm('¿Está seguro de que desea eliminar esta cotización? Esta acción no se puede deshacer.')) {
                  setIsSaving(true);
                  api.solicitud('/cotizaciones.php?action=eliminar', 'POST', { id: editingId }).then(res => {
                    setIsSaving(false);
                    if (res.exito) {
                      MQF.toast('✅ Cotización eliminada correctamente', 'success');
                      setEditingId(null);
                      setEditingNum(null);
                      setType(''); setUso(''); setCapacidad(''); setInsurer(''); setPrice(0); setErrors({}); setSelectedCoverage(''); setOptionalSelected({}); setUsarNCF(false);
                      setCliente(''); setCedula('');
                      cargarHistorial();
                    } else {
                      MQF.toast('Error: ' + res.mensaje, 'error');
                    }
                  }).catch(e => {
                    setIsSaving(false);
                    MQF.toast('Error: ' + e.message, 'error');
                  });
                }
              }} className="mqf-btn mqf-btn--danger" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
                <i className="fa-solid fa-trash"></i> Eliminar Cotización
              </button>
            )}
            
            <label className="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" checked={usarNCF} onChange={e=> setUsarNCF(e.target.checked)} className="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" />
              <span className="text-sm text-gray-700 font-semibold">Generar NCF (B02)</span>
            </label>
            
            <button type="button" onClick={()=>{ 
              setEditingId(null);
              setEditingNum(null);
              setType(''); setUso(''); setCapacidad(''); setInsurer(''); setPrice(0); setErrors({}); setSelectedCoverage(''); setOptionalSelected({}); setUsarNCF(false);
              setCliente(''); setCedula('');
            }} className="mqf-btn mqf-btn--secondary">
              <i className="fa-solid fa-rotate-left"></i> {editingId ? 'Cancelar Edición' : 'Restablecer'}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root-seguros')).render(<App />);
  </script>
<script>
  /* ── UX-SKINS: aplicar skin al cargar + escuchar mensajes del dashboard ── */
  (function(){
    var s = localStorage.getItem('mqf-skin') || 'indigo';
    document.body.setAttribute('data-skin', s);
    document.documentElement.setAttribute('data-skin', s);
  })();

  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'mqf-skin-set'){
      document.body.setAttribute('data-skin', e.data.skin);
      document.documentElement.setAttribute('data-skin', e.data.skin);
    }
  });
</script>

<script>
// ═══════════════════════════════════════════════════════════
// NOFTRAB Tab Guards — Cotizaciones v1.0
// ═══════════════════════════════════════════════════════════
const TAB_COTIZACIONES_GUARDS = [
    { elementId: 'tab-seguros',   permiso: 'TAB_COT_SEGUROS' },
    { elementId: 'tab-fianzas',   permiso: 'TAB_COT_FIANZAS' },
    { elementId: 'tab-historial', permiso: 'TAB_COT_HISTORIAL' },
];

async function initTabGuardsCotizaciones() {
    try {
        // 1. Obtener token de sesión (api-client.js lo guarda en localStorage como 'token_sesion')
        const token = localStorage.getItem('token_sesion') ||
                      sessionStorage.getItem('mqf_token') ||
                      sessionStorage.getItem('mqfToken');
        if (!token) return; // Sin token — modo debug, mostrar todo

        // 2. Intentar leer permisos desde el parent (dashboard ya los tiene cargados)
        let codigosPermisos = [];
        try {
            if (window.parent && window.parent.MQF_PERMISOS_NOFTRAB) {
                codigosPermisos = window.parent.MQF_PERMISOS_NOFTRAB;
            }
        } catch(pe) { /* cross-origin silenciado */ }

        // 3. Si no hay permisos del parent, consultar el backend
        if (codigosPermisos.length === 0) {
            try {
                const resp = await fetch('/PLATAFORMA_INTEGRADA/backend/api/auth/validar-sesion?token=' + encodeURIComponent(token));
                if (resp.ok) {
                    const data = await resp.json();
                    const rawPermisos = data.permisos || data.datos || data.codigos || [];
                    if (Array.isArray(rawPermisos)) {
                        codigosPermisos = rawPermisos.map(p => typeof p === 'string' ? p : (p.codigo || p.permiso || ''));
                    }
                }
            } catch(fetchErr) {
                console.warn('TabGuard Cotizaciones: no se pudo consultar permisos', fetchErr.message);
                return; // Fallar silenciosamente — mostrar todo
            }
        }

        // 4. Si la lista está vacía (sin granularidad configurada), mostrar todo
        if (codigosPermisos.length === 0) return;

        // 5. Ocultar tabs sin permiso
        TAB_COTIZACIONES_GUARDS.forEach(guard => {
            if (!codigosPermisos.includes(guard.permiso)) {
                const el = document.getElementById(guard.elementId);
                if (el) el.style.display = 'none';
            }
        });

        // 6. Activar el primer tab visible
        const tabIds = ['tab-seguros', 'tab-fianzas', 'tab-historial'];
        for (const id of tabIds) {
            const el = document.getElementById(id);
            if (el && el.style.display !== 'none') {
                el.click();
                break;
            }
        }

    } catch(e) {
        console.warn('TabGuard Cotizaciones:', e.message);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    initTabGuardsCotizaciones();
    cargarAseguradorasSimple();

    // Default NCF checkbox based on user profile
    const usuario = JSON.parse(localStorage.getItem('usuario_actual') || '{}');
    const esPDV = (usuario.perfil_id == 5) || (usuario.perfil && usuario.perfil.toLowerCase().includes('pdv'));
    const fUsarNcf = document.getElementById('f_usar_ncf');
    if (fUsarNcf) {
        fUsarNcf.checked = !esPDV;
    }
});
</script>
</body>
